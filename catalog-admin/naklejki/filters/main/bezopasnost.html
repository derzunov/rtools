<h1 id="rc_h1">Наклейки безопасности</h1> <p id="rc_subheader">Наклейки безопасности содержат важную информацию о правилах поведения в экстренных ситуациях, номера телефонов экстренных служб и инструкции по оказанию первой помощи. Наклейте их на видных местах, чтобы быть готовыми к любым непредвиденным обстоятельствам.</p>
