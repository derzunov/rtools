<h1 id="rc_h1">Медицинские наклейки</h1> <p id="rc_subheader">Медицинские наклейки — это наклейки, которые применяются в медицине для маркировки медицинского оборудования,  лекарственных средств, инструментов, аптечек, медицинских отходов. Наклейки медицинский красный крест на машину медицинской службы или скорой помощи.</p>
